# ghidra-mcp-ng naming rules configuration
#
# Rules are enforced on all write operations that set names. Each rule has:
#   pattern:  Java regex that the new name MUST fully match
#   message:  Error message shown to the agent when the rule is violated
#
# A field with no rule is unconstrained. Unknown keys are rejected at startup rather than
# ignored, so a typo cannot leave a rule silently unenforced.
#
# This file implements the naming conventions from REVERSING.md:
#   guess_<name>      — quick name without investigation
#   maybe_<name>      — strong reversing evidence (most common)
#   likely_<name>     — very clear from log messages / known APIs
#
# Edit this file and restart the server to apply changes.

timeouts:
  # Maximum time for one decompilation attempt used by decompile_function,
  # batch_decompile, and analyze_function_complete.
  decompile_seconds: 60

import:
  # Minimum number of sub-folder levels required in the project_dir supplied to
  # import_binary.  0 (default) allows placing binaries in the project root.
  # Set to 1 or higher to enforce an organised folder structure, e.g.:
  #   min_directory_depth: 1  → project_dir must be at least "binaries"
  #   min_directory_depth: 2  → project_dir must be at least "targets/2026"
  min_directory_depth: 0

  # When set, the absolute file_path supplied to import_binary must start with
  # this prefix, and the project_dir must equal the relative parent directory of
  # the file after stripping the prefix.
  #
  # Example: require_child_path: /a/
  #   Importing /a/hello/bin/moo.exe  → project_dir must be "hello/bin"
  #   Importing /a/moo.exe            → project_dir must be "" or "/"
  #
  # Uncomment and set the path to enable this constraint:
  # require_child_path: /targets/

# How much reading may run ahead of the record.
#
# Why this exists: reading is one cheap call that always succeeds, writing is N validated calls
# that can fail. An agent follows that gradient — it decompiles thirty functions, understands the
# binary perfectly in its own context, writes none of it down, and the next session opens the
# project to FUN_00401000 again. This caps the run-ahead.
#
# Counted reads are decompile_function and get_disassembly, and nothing else: those two are where
# a function's contents arrive and a finding is made. Searches, xrefs and listings are navigation
# — they find the next thing to look at — and charging them would only teach the agent to
# navigate blind. A call that fails its own argument validation is never charged.
#
# The budget is cleared by a write that records a finding: rename_function, set_variable,
# set_global, create_label, set_function_prototype, set_parameter_type, create_struct,
# add_struct_field, remove_struct_field, replace_struct_field. Deliberately NOT by:
#   set_comment  — prose substituting for names and types is the thing this rule exists to stop,
#                  so a comment must not buy more reading (see the comments: section below)
#   run_script   — a script's effect on the program cannot be inspected from here, so a read-only
#                  audit script would otherwise clear the budget for free
#   analyze_program, import_binary — program lifecycle, not findings
#
# The count is server-wide, not per program: it describes the agent's habit, and an agent
# alternating between two programs has still written nothing down.
#
# Keys:
#   max_without_write:  reads allowed between writes. 0 (default) disables the rule.
#   allow_ignore:       what happens once the budget is spent.
#                         true  — advisory. The budget resets as the error is raised, so
#                                 repeating the call succeeds and the error returns one budget
#                                 later. The agent is nagged, never stuck.
#                         false — forcing. Every further read is refused until a write lands.
#   message:            the ENTIRE error the agent is shown. Nothing is added to it — it replaces
#                       the built-in diagnostic rather than decorating it, so say everything the
#                       agent needs, including what to do next. Omit the key to fall back to the
#                       built-in text.

reads:
  max_without_write: 10
  allow_ignore: true
  message: >
    Read budget exhausted: too many functions decompiled or disassembled since the last write
    (see reads.max_without_write in rules.yaml). Persist what you have already worked out before
    reading further — rename the functions you identified, set the parameter, local and global
    names you inferred, and give the structures you recognised real fields. Any of rename_function,
    set_variable, set_global, create_label, set_function_prototype, set_parameter_type,
    create_struct, add_struct_field, remove_struct_field and replace_struct_field clears the
    budget, and several can be batched with batch_tool_call.
    set_comment does not clear this budget; a finding only reaches the next session as a name or
    a type, never as prose. A finding that exists only in this conversation is lost when it ends.

naming:

  function_name:
    pattern: "^((maybe_|likely_|guess_)[a-zA-Z0-9_]+|main|entry|_start)$"
    message: >
      Function names must start with maybe_, likely_, or guess_ (see REVERSING.md).
      Use maybe_<name> for names inferred from code behaviour,
      likely_<name> when a log message or known API makes it unambiguous,
      guess_<name> for quick labels without investigation.
      The exact names main, entry and _start are also permitted.

  variable_name:
    pattern: "^(maybe_|likely_|guess_)[a-zA-Z][a-zA-Z0-9_]*$"
    message: >
      Variable and parameter names must start with maybe_, likely_, or guess_ (see REVERSING.md).

  struct_field_name:
    pattern: "^(maybe_|likely_|guess_)[a-zA-Z0-9_]+(_0x[0-9a-fA-F]+)?$"
    message: >
      Struct field names must follow maybe_<name>_0x<offset> format (see REVERSING.md).
      The offset suffix (e.g. _0x8) makes it easy to detect accidental layout shifts.
      Example: maybe_size_0x8, maybe_vtable_0x0

  struct_name:
    pattern: "^(maybe_|likely_|guess_)[a-zA-Z][a-zA-Z0-9_]*$"
    message: >
      Struct names must start with maybe_, likely_, or guess_ (see REVERSING.md).
      Use maybe_<name> for types inferred from code behaviour,
      likely_<name> when a library header or debug information makes it unambiguous,
      guess_<name> for quick labels without investigation.

  # label_name (create_label) and global_name (set_global) are deliberately left
  # unconfigured here, which means unconstrained.
  #
  # The maybe_/likely_/guess_ prefixes mark a name as an inference. Data labels and globals
  # are frequently *recovered* rather than inferred — a CMSIS peripheral register, a symbol
  # from a map file, a string from the binary itself. Those are datasheet facts, and
  # UART0->CTRL is strictly more readable than likely_UART0->maybe_CTRL_0x18. Forcing the
  # prefix here does not make the analysis more honest; it makes projects apply these names
  # from GhidraScripts instead, which bypasses this file entirely.
  #
  # Uncomment either to enforce the prefixes on genuinely inferred labels/globals:
  #
  # label_name:
  #   pattern: "^((maybe_|likely_|guess_)[a-zA-Z0-9_]+|[A-Z][A-Za-z0-9_]*)$"
  #   message: >
  #     Label names must start with maybe_, likely_ or guess_ unless the name is recovered
  #     from a datasheet, header or map file (those may use the upstream spelling).
  #
  # global_name:
  #   pattern: "^((maybe_|likely_|guess_)[a-zA-Z0-9_]+|[A-Z][A-Za-z0-9_]*)$"

# Constraints on set_comment, keyed by comment type (PRE, POST, EOL, PLATE, REPEATABLE).
#
# Why this exists: a comment is one call that accepts arbitrary prose and never fails, while
# naming is N calls that are each validated and can fail. Left alone, that gradient produces
# a beautifully documented function full of local_2c and uVar7 — and nothing propagates,
# because the next session's tools read names and types, not prose.
#
# Every constraint is off unless set, and the whole section is optional. Available keys:
#   max_length:               maximum characters (tightens the global 4096 cap)
#   require_named_function:   reject a comment inside a still-FUN_/SUB_-named function
#   max_auto_named_variables: reject when the function still has more than N auto-named
#                             variables. Counts listing variables only (local_, param_,
#                             unaff_, in_, extraout_) — the decompiler's own uVar7/iVar3
#                             never reach the listing and are not counted.
#   message:                  appended to the specific diagnostic
#
# Do not ban PLATE outright. A plate is the right home for a role summary, a caveat the names
# cannot carry, or a pin/bit map with no natural home in a type. The goal is to stop it
# substituting for naming, not to remove it.

comments:

  PLATE:
    max_length: 300
    require_named_function: true
    message: >
      A plate comment is a 1-2 line pointer, not the analysis itself. Record what you found
      by renaming: rename_function, set_variable, set_function_prototype, create_struct.
      If it does not fit in 300 characters it belongs in names and types, not in prose.

  PRE:
    max_length: 500
    message: >
      Keep PRE comments to the reason for the code below, not a restatement of it.

  EOL:
    max_length: 120
